spring:
  application:
    name: log-collector-splunk
  threads:
    virtual:
      enabled: true
  # ai:
  #   retry:
  #     max-attempts: 3
  #   openai:
  #     api-key: ${OPENAI_API_KEY:sk-placeholder}
  #     chat:
  #       options:
  #         model: gpt-4o

ai:
  provider: ${AI_PROVIDER:openai}

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:demo}
      model-name: gpt-5.2
      temperature: 0.0
  google-ai-gemini:
    chat-model:
      api-key: ${GOOGLE_AI_GEMINI_API_KEY:demo}
      model-name: gemini-1.5-flash-001
      temperature: 0.0
  anthropic:
    chat-model:
      api-key: ${ANTHROPIC_API_KEY:demo}
      model-name: claude-3-haiku-20240307
      temperature: 0.0
  ollama:
    chat-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: llama3
      temperature: 0.0

splunk:
  host: ${SPLUNK_HOST:localhost}
  port: ${SPLUNK_PORT:8089}
  username: ${SPLUNK_USERNAME:admin}
  password: ${SPLUNK_PASSWORD:changeme}
